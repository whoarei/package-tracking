[package]
name = "package-tracking"
version = "0.1.0"
description = "Windows batch package tracking desktop app"
authors = ["Package Tracking"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "package_tracking_lib"
crate-type = ["rlib"]

[[bin]]
name = "package-tracking"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
